about:
  title: Sobre
  intro: Desenvolvedor full stack com foco em experiências web claras, rápidas e duráveis.
  body: "\nMinha trajetória começou no Instituto Metrópole Digital (IMD/UFRN), onde fiz o curso técnico em TI, e foi lá que a área de tecnologia virou caminho, não só curiosidade. Em paralelo, concluí a formação em Cibersegurança Júnior da Cisco, que mudou a forma como encaro qualquer sistema: a segurança não vem depois, ela nasce junto.\n\nDepois veio o Bacharelado Interdisciplinar em Ciências e Tecnologia na ECT/UFRN e um período no setor de TI do Departamento de Artes, onde aprendi que bom software é aquele que resolve um problema real de gente de verdade, sem fricção e sem ruído.\n\nComo programador júnior na Next Mindmid Hub, mergulhei em desenvolvimento full stack de verdade: APIs REST, autenticação JWT, filas, e-mails transacionais e dashboards. Construí o PIAF, uma API que gerencia turmas, matrículas com fila de espera e presenças; o Rookie Network, um app Ruby on Rails para onboarding e treinamento de novos funcionários; e o site da Windcraft Engenharia, hoje meu ambiente de trabalho.\n\nSigo como desenvolvedor full stack na Windcraft, construindo aplicações web duráveis com Vue, Nuxt, Ruby on Rails e Sinatra.\n\nO que eu busco é simples: continuar desenvolvendo soluções que facilitem e ajudem pessoas em diversas áreas. Seja com automação de sistemas, criação de novas ferramentas ou pesquisa e desenvolvimento. Quero construir software que dure e que faça diferença na vida de quem usa."
  stats:
    years:
      value: "4"
      label: anos de experiência
    projects:
      value: "12"
      label: projetos publicados
    languages:
      value: "2"
      label: idiomas
  timeline_title: Jornada
  timeline:
    - year: "2022"
      title: Curso técnico em TI, IMD/UFRN
      body: Comecei o curso técnico em TI no Instituto Metrópole Digital (IMD) da Universidade Federal do Rio Grande do Norte (UFRN).
    - year: "2023"
      title: Cisco Cyber Security Jr
      body: Concluí o curso de cibersegurança júnior da Cisco.
    - year: "2024"
      title: Bacharelado Interdisciplinar, ECT/UFRN
      body: Entrei na Escola de Ciências e Tecnologia da UFRN, no Bacharelado Interdisciplinar em Ciências e Tecnologia.
    - year: "2024"
      title: TI no Departamento de Artes
      body: Entrei para o setor de TI do Departamento de Artes da UFRN.
    - year: "2025"
      title: Programador Jr, Next Mindmid Hub
      body: No meio do ano, entrei como programador júnior na Next Mindmid Hub.
    - year: "Final de 2025"
      title: Formação em Redes de Computadores
      body: Concluí o curso técnico de Redes de Computadores pelo Instituto Metrópole Digital (IMD).
    - year: "2026"
      title: Windcraft Engenharia
      body: Entrei para a equipe da Windcraft Engenharia.
  quote_a: "Segurança de API não é recurso extra, não é add-on, não é plugin. "
  quote_mark: "É arquitetura."
  quote_b: "\n\nE arquitetura ruim não se conserta colocando um JWT e um proxy na frente. Ela nasce segura, ou nasce com problemas.."
