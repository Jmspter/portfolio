about:
  title: About
  intro: Full stack developer focused on web experiences that are clear, fast and built to last.
  body: "\nMy journey started at the Metrópole Digital Institute (IMD/UFRN), where I took the technical IT course, and that's when technology stopped being a curiosity and became a path. Along the way I completed Cisco's Junior Cybersecurity course, which changed the way I look at any system: security isn't an afterthought, it's built in from the start.\n\nThen came the Interdisciplinary Bachelor's in Science and Technology at ECT/UFRN, plus a stint in the IT team of the Department of Arts, where I learned that good software is software that solves a real problem for real people, without friction and without noise.\n\nAs a junior developer at Next Mindmid Hub I got into real full stack work: REST APIs, JWT auth, queues, transactional email and dashboards. I built PIAF, an API that manages classes, enrollments with waitlists and attendance; Rookie Network, a Ruby on Rails app for onboarding and training new hires; and the Windcraft Engineering website, the company I work at today.\n\nI now work as a full stack developer at Windcraft, building durable web applications with Vue, Nuxt, Ruby on Rails and Sinatra.\n\nWhat I'm looking for is simple: keep building solutions that make things easier for people across different fields, whether that's system automation, building new tools, or research and development. Software that lasts, and that makes a difference in the lives of the people who use it."
  stats:
    years:
      value: "4"
      label: years of experience
    projects:
      value: "12"
      label: published projects
    languages:
