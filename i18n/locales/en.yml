  timeline:
    - year: "2022"
      title: IT technician course, IMD/UFRN
      body: Started the IT technician programme at Instituto Metrópole Digital (IMD), Federal University of Rio Grande do Norte (UFRN).
    - year: "2023"
      title: Cisco Cybersecurity Junior
      body: Earned Cisco's junior cybersecurity certification.
    - year: "2024"
      title: Interdisciplinary Bachelor, ECT/UFRN
      body: Joined UFRN's School of Science and Technology (ECT), in the Interdisciplinary Bachelor's in Science and Technology.
    - year: "2024"
