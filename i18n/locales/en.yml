      body: Joined the Windcraft Engenharia team.
  quote_a: "API security is not an extra feature, not an add-on, not a plugin. "
  quote_mark: "It is architecture."
  quote_b: "\n\nAnd bad architecture isn't fixed by putting a JWT and a proxy in front of it. It is born secure, or it is born with problems.."
